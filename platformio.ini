; Jarvis eyes - dual GC9D01 on ESP32-C6
; Compile-check target. Flashing is never automatic: see README.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Arduino_GFX pinned by commit: the GC9D01 driver exists only on master, NOT in
; the v1.5.0 release tag. git+https is used because codeload archive URLs are
; blocked by the agent proxy (403) while git clone is allowed.
lib_deps =
    git+https://github.com/moononournation/Arduino_GFX.git#c2e3935

; Default: the brightness self-test. Prove the domes pass detail before anything
; else gets flashed.
[env:jarvis_eyes_c6]
extends = common
build_src_filter = +<selftest.cpp>

; The animated eyes. Flash only after the self-test passes.
[env:jarvis_eyes_anim]
extends = common
build_src_filter = +<eyes.cpp>
